version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    container_name: asystent-nart-app
    restart: unless-stopped
    
    # Porty
    ports:
      - "${PORT:-5001}:5001"
    
    # Zmienne środowiskowe
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5001}
      - FIRESNOW_API_URL=${FIRESNOW_API_URL:-http://host.docker.internal:8081}
      - USE_FIRESNOW_API=${USE_FIRESNOW_API:-true}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-sprzet_narciarski}
      - DB_HISTORY_NAME=${DB_HISTORY_NAME:-history}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=${LOG_DIR:-logs}
    
    # Volumes - dane i logi
    volumes:
      # Pliki CSV (rezerwacje, wypożyczenia, narty)
      - ./public/data:/app/public/data
      # Logi aplikacji
      - ./logs:/app/logs
    
    # Network - umożliwia dostęp do host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/api/health', (r) => {let data=''; r.on('data',d=>data+=d); r.on('end',()=>process.exit(r.statusCode===200?0:1)); r.on('error',()=>process.exit(1))})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    
    # Command dla production (może być nadpisany przez docker-compose.dev.yml)
    command: node server.js

